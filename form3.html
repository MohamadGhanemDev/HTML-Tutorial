<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="">
        <div>
            <input type="hidden" value="test" id="">
        </div>
        <div>
            <label for="user">Username</label>
            <input type="text" name="user" id="user" required placeholder="Enter your username">
        </div>
        <br>
        <div>
            <label for="userpass">Password</label>
            <input type="password" name="pass" id="userpass" required placeholder="Enter a complex password">
        </div>
        <br>
        <div>
            <label for="usermail">Email</label>
            <input type="email" name="mail" id="usermail"  placeholder="enter a valid email" value="example@gmail.com">
        </div>
        <br>
        <div>
            <label for="rng">Range</label>
            <input type="range" name="range" id="rng" min="0" max="100" step="50">
        </div>
        <br>
        <div>
            <label for="num">Number</label>
            <input type="number" name="number" id="num" min="0" max="100" step="2">
        </div>
        <input type="submit" name="bnt1" id="submit" value="save">
        <input type="reset" name="rst" id="reset">
        <input type="color" name="color" id="clr">
        
    <!-- hidden , reset , color , range , number -->  


    </form>
</body>
</html>
