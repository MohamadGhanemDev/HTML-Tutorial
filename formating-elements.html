<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<!--
b => bold (not important text) , strong => same bold (important text)
i => italic (not important text), em => emphasized (important text)
mark => mark highlight
u => underlined
small => small text
del => deleted text
ins => inserted text
sub => subscript
sup => superscript
-->
<body>
    <p> <b>Hello</b> this is my paragraph</p>
    <p> <strong>Hello</strong> this is my paragraph</p>
    <p> <i>Hello</i> this is my paragraph</p>
    <p> <em>Hello</em> this is my paragraph</p>
    <p> <mark>Hello</mark> this is my paragraph</p>
    <p> <u>Hello</u> this is my paragraph</p>
    <p> <small>Hello</small> this is my paragraph</p>
    <p> <del>Hello</del> this is my paragraph</p>
    <p> <del>100$</del> 80$</p>
    <p> <ins>Hello</ins> this is my paragraph</p>
    <p> H<sub>2</sub>O</p>
    <p>2 <sup>2</sup></p>

</body>
</html>
