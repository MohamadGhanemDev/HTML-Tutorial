<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
    thead => table head
    tbody => table body
    tfoot => table footer

    tr =>table row
    td => table data cell
    th => table header cell
    -->
    <table border="1" cellpadding="5px">
        <caption>Student Marks</caption>
        <thead >
            <tr>
            <th>Fname</th>
            <th>Lname</th>
            <th>Marks</th>
        </tr>
        </thead>
        <tbody>
            <tr>
                <td>Mhmd</td>
                <td>Ghanem</td>
                <td>50</td>
            </tr>
            <tr>
                <td>Ahmad</td>
                <td>Gh</td>
                <td>80</td>
            </tr>
            <tr>
                <td>Sara</td>
                <td>Gh</td>
                <td>100</td>
            </tr>
            
        </tbody>
        <tfoot>
            <tr>
                <td>One</td>
                <td>two</td>
                <td>three</td>
            </tr>
            <tr>
                <td colspan="2">total</td>
                
                <td>230</td>
            </tr>
            <tr>
                
                
                <td colspan="3">230</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
