<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<form action="">
        <div>
            <input type="radio" name="os" value="windows">
            <label>Windows</label>
        </div>
        <div>
            <input type="radio" name="os" value="linux">
            <label>Linux</label>
        </div>
        <div>
            <input type="radio" name="os" value="mac">
            <label>Mac</label>
        </div>
        <hr>
        
        <div>
            <input id="win" type="checkbox" name="os" value="windows">   <!-- id link with for to click on thw word to check it not only the checkbox or radio-->
            <label for="win">Windows</label>
        </div>
        <div>
            <input type="checkbox" name="os" value="linux">
            <label>Linux</label>
        </div>
        <div>
            <input type="checkbox" name="os" value="mac">
            <label>Mac</label>
        </div>


        
        <!-- RADIO AND CHECKBOX-->

    </form>
</body>
</html>
