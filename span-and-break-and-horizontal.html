<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <p>Lorem <span style="color: red; font-size: 30px;" >ipsum dolor</span> sit amet consectetur adipisicing elit.</p>
    <p>Lorem ipsum dolor sit <br> amet consectetur adipisicing elit.</p>
    <hr>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
</body>
</html>

<!-- hr is not inline but it is block
 
inline comes beside the elements

block-level elements always start on a new line and take up the
full width available, while inline elements do not
start on a new line and only take up as much width
as their content requires.

Block Elements
These elements act as structural containers for the webpage.
<div>: A generic container used to group content.
<p>: Formats text paragraphs with natural spacing.
<h1> through <h6>: Section headings.
<ul>, <ol>, and <li>: Structural list elements.

Inline Elements

<span>: A generic container used to wrap text for individual styling.
<a>: Creates standard hyperlinks.
<strong> / <em>: Adds emphasis or boldness to specific words.
<img>: Embeds visual content directly into lines of text.
